name: iosApp
options:
  bundleIdPrefix: com.astrocompass
  deploymentTarget:
    iOS: "15.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    settings:
      base:
        PRODUCT_NAME: AstroCompass
        PRODUCT_BUNDLE_IDENTIFIER: com.astrocompass
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "2.0.0-alpha"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited) @executable_path/Frameworks"
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode --no-configuration-cache -Pcompose.ios.resources.sync=false
        basedOnDependencyAnalysis: false
